<title>Challenge Tracker</title>

<script type="module">

const wasm = await init({ module_or_path: '/challenge-tracker/challenge-tracker-d8451937e47ad9e5_bg.wasm' });

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

<!-- iOS для «Добавить на домашний экран» берёт apple-touch-icon и SVG не принимает -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="modulepreload" href="/challenge-tracker/challenge-tracker-d8451937e47ad9e5.js" crossorigin="anonymous" integrity="sha384-MTWta/fu+35Rmw/aNUtZ8U2Xy7bP1+ybKsudtEIks+nsvJS1w7ifQAzU5RYWmzAU"><link rel="preload" href="/challenge-tracker/challenge-tracker-d8451937e47ad9e5_bg.wasm" crossorigin="anonymous" integrity="sha384-HhpC4ISO8zbeSW75gDdFl016ZXYomV3M2+FtaurM98uddEkJOFXUfDwryoK3F4KX" as="fetch" type="application/wasm"></head>
<body>
<script>
  // Путь относительный: под /challenge-tracker/ регистрация даст /challenge-tracker/sw.js,
  // и scope совпадёт с приложением. Абсолютный /sw.js на Pages сломал бы оффлайн.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
