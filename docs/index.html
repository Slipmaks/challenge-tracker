<title>Challenge Tracker</title>

<script type="module">
import init, * as bindings from '/challenge-tracker/challenge-tracker-8a3750a1be7160e1.js';
const wasm = await init({ module_or_path: '/challenge-tracker/challenge-tracker-8a3750a1be7160e1_bg.wasm' });

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

<link rel="manifest" href="manifest.json">
<!-- iOS для «Добавить на домашний экран» берёт apple-touch-icon и SVG не принимает -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="modulepreload" href="/challenge-tracker/challenge-tracker-8a3750a1be7160e1.js" crossorigin="anonymous" integrity="sha384-n5MxqJuKWbmwOMmFwmGJDWpRpeCA0DJKZnkdrW+aUc1ucrozbCcTLwYfTBJEWMgG"><link rel="preload" href="/challenge-tracker/challenge-tracker-8a3750a1be7160e1_bg.wasm" crossorigin="anonymous" integrity="sha384-1h4Frgh11/aZwtW2Z/Ab+LlE5FJe9irxPQ+SK96eidA4hcrF4MZfbg10sgfnYh5x" as="fetch" type="application/wasm"></head>
<body>
<script>
  // Путь относительный: под /challenge-tracker/ регистрация даст /challenge-tracker/sw.js,
  // и scope совпадёт с приложением. Абсолютный /sw.js на Pages сломал бы оффлайн.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
