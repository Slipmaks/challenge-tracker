<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e9ef">
<title>Challenge Tracker</title>
<link data-trunk rel="rust" />
<link data-trunk rel="css" href="style.css" />
<!-- target-path=".": sw.js обязан лежать в корне, иначе его scope не покроет приложение -->
<link data-trunk rel="copy-dir" href="public" data-target-path="." />
<link rel="manifest" href="manifest.json">
<!-- iOS для «Добавить на домашний экран» берёт apple-touch-icon и SVG не принимает -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<script>
  // Путь относительный: под /challenge-tracker/ регистрация даст /challenge-tracker/sw.js,
  // и scope совпадёт с приложением. Абсолютный /sw.js на Pages сломал бы оффлайн.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
