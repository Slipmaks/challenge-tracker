[package]
name = "challenge-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
js-sys = "0.3"

[profile.release]
opt-level = "z"
lto = true
